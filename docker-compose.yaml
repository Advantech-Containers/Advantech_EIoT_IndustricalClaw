# IndustrialClaw 1.0.0, the whole stack in one file:
#
#   docker compose up -d        then open https://<this machine>:18765/  (admin / admin)
#
# Everything it keeps lives under /opt/industrialclaw on this machine; README.md says what each
# directory is. Defaults can be changed in a .env beside this file (see .env.example) -- above all
# GPU_RUNTIME=runc on a machine without the NVIDIA container toolkit.
#
# One stack per machine, and not beside an installed (.run) IndustrialClaw: container names,
# ports and the network are the same.
name: industrialclaw

services:
  ollama:
    container_name: industrialclaw-ollama
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw-ollama:0.32.4
    # Root in its image, but it needs no capability: its own files, a port above 1024, the GPU.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    init: true
    runtime: ${GPU_RUNTIME:-nvidia}
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      # Empty: chosen by memory at start (32768 under 24 GiB, 65536 under 48, else 262144).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: ${OPENCLAW_TZ:-UTC}
    # 23951 is the port 1.0.0's EdgeAI Ollama listened on; the model config points at it.
    # Not on the LAN: Ollama has no authentication. 127.0.0.1 is for init (host network); the
    # host-gateway IP is what host.docker.internal resolves to, for the Gateway and every Skill
    # runtime, whatever network they are on.
    ports:
      - "127.0.0.1:23951:11434"
      - "${DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:23951:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Prepares /opt/industrialclaw (what 1.0.0's installer and run.sh did on the host), stays up,
  # and on stop removes from data/ everything that is not kept -- see ic-init.sh. Everything else
  # depends on it, so `down` stops it last.
  # Host network for two things in ic-init.sh: the Dashboard certificate's SAN takes this machine's
  # address (on a bridge it would be the container's 10.201.0.x), and the wait for Ollama asks
  # 127.0.0.1:23951. It listens on nothing, so it opens no port. Leaving the host network means
  # changing the image: the address from .env, the wait at ollama:11434 -- for the next rebuild.
  industrialclaw-init:
    container_name: industrialclaw-init
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw:1.0.0
    user: root
    network_mode: host
    # chown/chmod the tree for uid 1000, rm in directories uid 1000 owns, setpriv to uid 1000.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /home/node
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - /opt/industrialclaw:/target
      - /opt/industrialclaw/data:/home/node/.openclaw
      - /opt/industrialclaw/secrets:/run/industrialclaw/secrets
      - industrialclaw-run:/run/industrialclaw/run
    entrypoint: ["/usr/local/bin/ic-init.sh"]
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "test", "-e", "/run/industrialclaw/run/ready"]
      interval: 2s
      timeout: 2s
      start_period: 10m
    depends_on:
      ollama:
        condition: service_healthy

  openclaw-gateway:
    container_name: openclaw-gateway
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw:1.0.0
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}
      OPENCLAW_PLUGIN_STAGE_DIR: /var/lib/openclaw/plugin-runtime-deps
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - /opt/industrialclaw/data:/home/node/.openclaw
      - /opt/industrialclaw/skills:/home/node/.openclaw/workspace/skills:ro
      - /opt/industrialclaw/skills/agent-manager/extensions/industrialclaw-skill-executor:/home/node/.openclaw/extensions/industrialclaw-skill-executor:ro
      - /opt/industrialclaw/skills/agent-manager/extensions/task-scope-gate:/home/node/.openclaw/extensions/task-scope-gate:ro
      - /opt/industrialclaw/secrets:/run/industrialclaw/secrets:ro
      - openclaw-plugin-runtime-deps:/var/lib/openclaw/plugin-runtime-deps
      - industrialclaw-run:/run/industrialclaw/run:ro
    tmpfs:
      - /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/.private:rw,nosuid,nodev,noexec,mode=000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    # Waits for init: after a reboot the daemon starts every container at once, without depends_on.
    command: ["sh", "-c", "until [ -e /run/industrialclaw/run/ready ]; do sleep 1; done; exec node dist/index.js gateway --bind ${OPENCLAW_GATEWAY_BIND:-lan} --port 18789"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      industrialclaw-init:
        condition: service_healthy
        restart: true

  # Not a server: `docker compose run --rm openclaw-cli <args>` is how a person talks to the
  # Gateway (1.0.0's openclaw_cli.sh did exactly that). In a profile so `up` does not leave an
  # exited container behind; `run` names the service, which enables its profile.
  openclaw-cli:
    profiles: [cli]
    container_name: openclaw-cli
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw:1.0.0
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_PLUGIN_STAGE_DIR: /var/lib/openclaw/plugin-runtime-deps
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - /opt/industrialclaw/data:/home/node/.openclaw
      - /opt/industrialclaw/skills:/home/node/.openclaw/workspace/skills:ro
      - /opt/industrialclaw/skills/agent-manager/extensions/industrialclaw-skill-executor:/home/node/.openclaw/extensions/industrialclaw-skill-executor:ro
      - /opt/industrialclaw/skills/agent-manager/extensions/task-scope-gate:/home/node/.openclaw/extensions/task-scope-gate:ro
      - /opt/industrialclaw/secrets:/run/industrialclaw/secrets:ro
      - openclaw-plugin-runtime-deps:/var/lib/openclaw/plugin-runtime-deps
    tmpfs:
      - /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/.private:rw,nosuid,nodev,noexec,mode=000
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      openclaw-gateway:
        condition: service_healthy

  agent-launcher:
    container_name: agent-launcher
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw-agent-launcher:2026.10.08
    # Root over docker.sock, which root owns: that needs no capability, and it is host root
    # whatever is dropped here. Writing and chmod-ing in uid 1000's data/ does need two.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    init: true
    user: root
    environment:
      # Host paths: the launcher hands them to the Docker daemon in `-v` for each Skill runtime,
      # and the daemon resolves them on the host.
      OPENCLAW_HOST_ROOT: /opt/industrialclaw/data
      OPENCLAW_HOST_SKILLS: /opt/industrialclaw/skills
      # Container path: `docker compose -f` reads the file inside THIS container.
      OPENCLAW_SKILL_COMPOSE: /openclaw/workspace/skills/agent-manager/compose/docker-compose-skill.yml
      TZ: ${OPENCLAW_TZ:-UTC}
      # docker compose interpolates the Skill runtime file inside this container, so its values
      # have to be here.
      GPU_RUNTIME: ${GPU_RUNTIME:-nvidia}
      SKILL_LOCAL_SIZE: ${SKILL_LOCAL_SIZE:-8g}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/industrialclaw/data:/openclaw
      - /opt/industrialclaw/skills:/openclaw/workspace/skills:ro
      - industrialclaw-run:/run/industrialclaw/run:ro
    tmpfs:
      - /openclaw/workspace/skills/ai-agent-control-dashboard/.private:rw,nosuid,nodev,noexec,mode=000
    # The Skill runtimes it starts are compose projects of their own (oc-skill-<agent>) that `down`
    # here never sees; it removes them on stop, so none outlives the stack or holds data/ open.
    # Before serving, it pulls the Skill runtime image: a Task's first Skill would otherwise start
    # a 2 GB download that outlasts the exec's wait. By tag, not digest: docker-compose-skill.yml
    # names the tag, and an image pulled by digest is left untagged. The tag is build.sh's
    # RUNNER_FROM digest. A failed pull (offline) does not stop the launcher.
    stop_grace_period: 1m
    command:
      - sh
      - -c
      - |
        until [ -e /run/industrialclaw/run/ready ]; do sleep 1; done
        img=advigw/industrialclaw-skill-runner:python3.12-nodejs24-bookworm
        docker image inspect "$$img" >/dev/null 2>&1 || docker pull -q "$$img"
        sh /openclaw/workspace/skills/agent-manager/scripts/agent_launcher.sh & pid=$$!
        trap 'kill $$pid; docker ps -aq --filter name=skill-runner- | xargs -r docker rm -f >/dev/null; docker network ls -q --filter name=oc-skill- | xargs -r docker network rm >/dev/null; exit 0' TERM INT
        wait $$pid
    depends_on:
      openclaw-gateway:
        condition: service_healthy
        restart: true

  ai-agent-control-dashboard:
    container_name: ai-agent-control-dashboard
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Python 3.12 with SkillSpector built in (submodule pin 33c7b74, as in 1.0.0), replacing
    # 1.0.0's python:3.11-slim + skillspector-install.
    image: harbor.edgesync.cloud/advantecheiot/advigw/industrialclaw-platform:2026.09.23
    restart: unless-stopped
    init: true
    user: "1000:1000"
    # nvidia-smi (dGPU utilization, VRAM) only exists inside the container under this runtime.
    runtime: ${GPU_RUNTIME:-nvidia}
    working_dir: /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard
    environment:
      HOME: /home/node
      # /usr/sbin last: where the L4T CSV runtime mounts nvidia-smi.
      PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-UTC}
      PYTHONDONTWRITEBYTECODE: "1"
      OPENCLAW_GATEWAY_URL: ws://openclaw-gateway:18789
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      OPENCLAW_AGENTS_API_ALLOWED_CIDRS: ${OPENCLAW_AGENTS_API_ALLOWED_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      SECURITY_SCAN_LEVEL: ${SECURITY_SCAN_LEVEL:-medium}
      OPENCLAW_DASHBOARD_TLS_CERT: /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/.private/dashboard.crt
      OPENCLAW_DASHBOARD_TLS_KEY: /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/.private/dashboard.key
      OPENCLAW_DASHBOARD_REQUIRE_TLS: "1"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: utility
      OPENCLAW_APP_VERSION: "1.0.0"
    volumes:
      - /opt/industrialclaw/data:/home/node/.openclaw
      - /opt/industrialclaw/skills:/home/node/.openclaw/workspace/skills:ro
      - /opt/industrialclaw/private:/home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/.private
      - /opt/industrialclaw/secrets:/run/industrialclaw/secrets:ro
      - industrialclaw-run:/run/industrialclaw/run:ro
      # Advantech device readings; on any other machine Docker creates these as empty directories
      # and the collector falls back to system-monitor, as 1.0.0 did.
      - /etc/Advantech/EAS/service:/etc/Advantech/EAS/service:ro
      - /opt/Advantech/EdgeAI/System/Nvidia_Jetson/SDK/service:/opt/Advantech/EdgeAI/System/Nvidia_Jetson/SDK/service:ro
    tmpfs:
      # dashboard-data.json: a cache --refresh rebuilds, and the only thing written in the skills tree.
      - /home/node/.openclaw/workspace/skills/ai-agent-control-dashboard/data:rw,nosuid,nodev,noexec,uid=1000,gid=1000,mode=0755
    ports:
      - "${AI_AGENT_DASHBOARD_PORT:-18765}:8765"
    # The token comes from the file industrialclaw-init wrote; this image has no entrypoint of ours.
    command:
      - sh
      - -c
      - |
        until [ -e /run/industrialclaw/run/ready ]; do sleep 1; done
        export OPENCLAW_GATEWAY_TOKEN="$$(cat /run/industrialclaw/secrets/gateway.token)"
        exec python3 scripts/serve_dashboard.py --host 0.0.0.0 --port 8765 --refresh
    depends_on:
      openclaw-gateway:
        condition: service_healthy
        restart: true

volumes:
  openclaw-plugin-runtime-deps: {}
  # init's "ready" mark, in memory: emptied when the last container using it stops, so a reboot or
  # `down` never leaves a mark from the previous run.
  industrialclaw-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m

networks:
  # Pinned as in 1.0.0: Docker's default pool, 172.16.0.0/12, can draw the range the LAN lives
  # in, and then the Dashboard answers on the device and times out from anywhere else.
  default:
    ipam:
      config:
        - subnet: ${OPENCLAW_NETWORK_SUBNET:-10.201.0.0/24}

